name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*" }
      - name: Install exactly the locked, hash-verified runtime dependencies, then the dev tools
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pyright -p ..
      - run: pytest # includes the coverage gate (fail_under in pyproject.toml)
      - name: Known vulnerabilities in the locked dependencies
        run: pip-audit -r requirements.lock --no-deps --disable-pip
      - name: requirements.lock is up to date with requirements.txt
        run: |
          uv pip compile requirements.txt --universal --generate-hashes --python-version 3.12 -o requirements.lock
          git diff --exit-code requirements.lock
      - name: The committed API schema and generated client match the backend
        run: | # the generator runs in Docker, which the runner has; a difference means "regenerate and commit"
          python export_openapi.py
          (cd ../frontend && node scripts/generate-api.mjs)
          git diff --exit-code -- ../frontend/openapi.json ../frontend/src/shared/api/generated

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run coverage
      - run: npm audit --omit=dev --audit-level=high # blocks: what ships to users
      - run: npm audit --audit-level=high # dev tooling: informational, see docs/ENGINEERING.md (D-17)
        continue-on-error: true
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e # builds the UI, starts the real backend with the mock translator, runs Playwright + axe
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t translation-tool .
      - name: The image starts, migrates its database and answers (as a non-root user)
        run: |
          docker run -d --name app -p 8000:8000 -e LLM_PROVIDER=mock translation-tool
          for i in $(seq 1 30); do curl -sf localhost:8000/api/ready && break; sleep 2; done
          curl -sf localhost:8000/api/ready
          test "$(docker exec app sh -c 'grep -m1 ^Uid: /proc/1/status | cut -f2')" = "10001"
          curl -sf -X POST localhost:8000/api/auth/login -d "username=admin&password=admin123" | grep -q access_token
      - name: Container logs on failure
        if: failure()
        run: docker logs app
